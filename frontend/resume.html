<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrepLine · Resume</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav" id="nav"></nav>
    <header class="page-head">
      <div class="kicker">Resume upload</div>
      <h1>Drop in the document you would actually send.</h1>
      <p class="muted">PDF, DOCX, or TXT. We extract text and skills to shape the interview questions.</p>
    </header>
    <form id="uploadForm" class="card drop">
      <input type="file" name="file" accept=".pdf,.docx,.txt" required />
      <button type="submit" style="margin-top:16px">Upload and parse</button>
      <p class="muted" id="uploadStatus"></p>
    </form>
    <h2>Your resumes</h2>
    <div class="grid" id="resumeList"></div>
    <footer>PrepLine · AI Interview Preparation Platform</footer>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/resume.js"></script>
</body>
</html>
